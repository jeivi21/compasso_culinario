<svg viewBox="0 0 560 560" width="560" height="560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="fundo" cx="38%" cy="30%" r="80%">
    <stop offset="0" stop-color="#7FE0D4"/>
    <stop offset="0.55" stop-color="#2EC4B6"/>
    <stop offset="1" stop-color="#1A9E92"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B5E56"/>
    <stop offset="0.45" stop-color="#0E2E2B"/>
    <stop offset="1" stop-color="#0B5E56"/>
  </linearGradient>
  <linearGradient id="metalClaro" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#CDE9E4"/>
    <stop offset="1" stop-color="#0B7A70"/>
  </linearGradient>
  <linearGradient id="lamina" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F3FBF9"/>
    <stop offset="0.6" stop-color="#CDE9E4"/>
    <stop offset="1" stop-color="#7FE0D4"/>
  </linearGradient>
  <linearGradient id="prato" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DDF2EE"/>
  </linearGradient>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dy="10" result="s"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- fundo -->
<circle cx="280" cy="280" r="272" fill="url(#fundo)"/>
<circle cx="280" cy="280" r="272" fill="none" stroke="#F3FBF9" stroke-opacity="0.35" stroke-width="6"/>
<circle cx="280" cy="280" r="236" fill="none" stroke="#F3FBF9" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="3 12"/>

<!-- arco riscado pelo compasso -->
<path d="M140 436 A 340 340 0 0 0 420 436" fill="none" stroke="#F3FBF9" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 24"/>

<!-- prato -->
<g filter="url(#sombra)">
  <ellipse cx="280" cy="464" rx="156" ry="28" fill="url(#prato)"/>
  <ellipse cx="280" cy="460" rx="118" ry="18" fill="#CDE9E4"/>
  <ellipse cx="280" cy="458" rx="84" ry="11" fill="#DDF2EE"/>
  <ellipse cx="236" cy="452" rx="26" ry="5" fill="#FFFFFF" opacity="0.8"/>
</g>

<!-- compasso -->
<g filter="url(#sombra)">
  <!-- perna esquerda: garfo -->
  <g transform="rotate(-19 280 112)">
    <rect x="266" y="128" width="28" height="248" rx="14" fill="url(#metal)"/>
    <rect x="272" y="140" width="6" height="200" rx="3" fill="#7FE0D4" opacity="0.35"/>
    <path d="M256 370 H304 V392 Q304 418 280 422 Q256 418 256 392 Z" fill="#0E2E2B"/>
    <rect x="256" y="398" width="9" height="54" rx="4.5" fill="#0E2E2B"/>
    <rect x="269" y="398" width="9" height="58" rx="4.5" fill="#0E2E2B"/>
    <rect x="282" y="398" width="9" height="58" rx="4.5" fill="#0E2E2B"/>
    <rect x="295" y="398" width="9" height="54" rx="4.5" fill="#0E2E2B"/>
    <!-- anel decorativo -->
    <rect x="262" y="236" width="36" height="12" rx="6" fill="url(#metalClaro)"/>
  </g>
  <!-- perna direita: faca -->
  <g transform="rotate(19 280 112)">
    <rect x="266" y="128" width="28" height="186" rx="14" fill="url(#metal)"/>
    <rect x="272" y="140" width="6" height="150" rx="3" fill="#7FE0D4" opacity="0.35"/>
    <rect x="262" y="236" width="36" height="12" rx="6" fill="url(#metalClaro)"/>
    <!-- guarda -->
    <rect x="256" y="300" width="48" height="14" rx="7" fill="#0B7A70"/>
    <!-- lâmina -->
    <path d="M266 312 H296 Q314 364 304 424 L282 456 Q262 404 266 312 Z" fill="url(#lamina)"/>
    <path d="M282 316 L285 436 L282 452 L279 436 Z" fill="#0B7A70" opacity="0.35"/>
  </g>
  <!-- cabo e articulação -->
  <rect x="264" y="30" width="32" height="64" rx="16" fill="url(#metal)"/>
  <rect x="258" y="78" width="44" height="14" rx="7" fill="url(#metalClaro)"/>
  <circle cx="280" cy="112" r="42" fill="url(#metal)"/>
  <circle cx="280" cy="112" r="30" fill="none" stroke="#7FE0D4" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="280" cy="112" r="17" fill="#2EC4B6"/>
  <circle cx="280" cy="112" r="7" fill="#0E2E2B"/>
  <circle cx="270" cy="102" r="5" fill="#F3FBF9" opacity="0.7"/>
</g>

<!-- brilho -->
<path d="M120 170 Q200 70 330 60" fill="none" stroke="#F3FBF9" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
<circle cx="412" cy="150" r="6" fill="#F3FBF9" opacity="0.85"/>
<circle cx="440" cy="126" r="3.5" fill="#F3FBF9" opacity="0.7"/>
</svg>
